# docker-compose.yml
version: '3.8'

services:
  scraper:
    build: .
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # Run daily at 8 AM
    command: sh -c "while true; do python app.py --max-retries 3; sleep 86400; done"